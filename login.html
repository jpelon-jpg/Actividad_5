<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Sistema Escolar</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="login-layout">
    <section class="login-brand" aria-hidden="true">
      <img src="img/logo.svg" alt="" width="56" height="56">
      <h1>Sistema Escolar</h1>
      <p>Captura de usuarios y registro de alumnos en un solo lugar.</p>
    </section>

    <section class="login-panel">
      <form id="formLogin" class="login-card" novalidate>
        <h2>Iniciar sesión</h2>
        <p class="text-muted mb-4">Ingresa con tu correo y contraseña.</p>

        <div class="mb-3">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="correo" autocomplete="username" placeholder="nombre@correo.com">
          <div class="invalid-feedback" id="errorCorreo"></div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group has-validation">
            <input type="password" class="form-control" id="password" autocomplete="current-password">
            <button type="button" class="btn btn-outline-secondary" id="btnVer" aria-label="Mostrar contraseña">Ver</button>
            <div class="invalid-feedback" id="errorPassword"></div>
          </div>
          <div class="form-text">Mínimo 8 caracteres, con mayúscula, minúscula, número y símbolo.</div>
        </div>

        <button type="submit" class="btn btn-acceso w-100">Entrar al sistema</button>
      </form>
    </section>
  </main>

  <script src="js/utileria.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
