<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>utileria.js | Iniciar sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="pagina" style="max-width: 460px;">
    <h1>Iniciar sesión</h1>

    <section class="panel">
      <p class="aviso" id="aviso" role="alert"></p>

      <form id="formLogin" novalidate>
        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" autocomplete="username" placeholder="ana@correo.com">
          <p class="mensaje" id="msg-correo"></p>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <div class="fila-password">
            <input type="password" id="password" autocomplete="current-password">
            <button type="button" class="btn-secundario" id="verPassword" aria-pressed="false">Mostrar</button>
          </div>
          
          <p class="mensaje" id="msg-password"></p>
        </div>

        <button type="submit" class="btn-primario">Entrar</button>
      </form>
    </section>

    
  </div>

  <script src="js/utileria.js"></script>
  <script>
    var inputCorreo = document.getElementById("correo");
    var inputPassword = document.getElementById("password");
    var aviso = document.getElementById("aviso");

    function mostrarAviso(tipo, texto) {
      aviso.className = "aviso visible " + tipo;
      aviso.textContent = texto;
    }

    function marcar(input, msgId, valido, textoError) {
      input.classList.toggle("invalido", !valido);
      input.classList.toggle("valido", valido);
      document.getElementById(msgId).textContent = valido ? "" : textoError;
      return valido;
    }

    // Lista de requisitos que se marca mientras se escribe.
    // La validación oficial sigue siendo validarPassword().
    inputPassword.addEventListener("input", function () {
      var v = inputPassword.value;
      var reglas = {
        longitud: v.length >= 8,
        mayuscula: /[A-Z]/.test(v),
        minuscula: /[a-z]/.test(v),
        numero: /[0-9]/.test(v),
        especial: /[^A-Za-z0-9\s]/.test(v)
      };
      var items = document.querySelectorAll("#requisitos li");
      for (var i = 0; i < items.length; i++) {
        items[i].classList.toggle("cumple", reglas[items[i].getAttribute("data-req")]);
      }
    });

    document.getElementById("verPassword").addEventListener("click", function () {
      var visible = inputPassword.type === "text";
      inputPassword.type = visible ? "password" : "text";
      this.textContent = visible ? "Mostrar" : "Ocultar";
      this.setAttribute("aria-pressed", String(!visible));
    });

    document.getElementById("formLogin").addEventListener("submit", function (e) {
      e.preventDefault();
      aviso.className = "aviso";

      var correoOk = marcar(inputCorreo, "msg-correo", validarCorreo(inputCorreo.value),
        "Escribe un correo válido, como ana@correo.com.");
      var passOk = marcar(inputPassword, "msg-password", validarPassword(inputPassword.value),
        "La contraseña no cumple con todos los requisitos.");

      if (!correoOk || !passOk) {
        mostrarAviso("error", "Revisa los campos marcados antes de continuar.");
        return;
      }

      // Demostración: no hay servidor, así que solo se confirma la validación.
      mostrarAviso("exito", "Datos válidos. En una app real, aquí se enviarían al servidor.");
    });
  </script>
</body>
</html>
